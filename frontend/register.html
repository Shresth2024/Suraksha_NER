<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | SURAKSHA NER</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">N</span>NER<span class="accent">-SAFE</span></a><a class="back" href="index.html">← Back</a></header>
<main class="auth-wrap"><div class="auth-card"><div class="center"><span class="eyebrow">CREATE SAFETY PROFILE</span><h1>Get location-aware alerts</h1><p>Register once to set up your alert profile.</p></div>
<form onsubmit="registerDemo(event)"><label>Full name<input name="name" required placeholder="Enter your name"></label><label>Phone number<input name="phone" required type="tel" placeholder="+91 XXXXX XXXXX"></label><label>Gmail address<input name="email" required type="email" placeholder="you@gmail.com"></label><label>Password<input name="password" required type="password" minlength="6" placeholder="Create a password (6+ characters)"></label><label>Preferred area<input name="preferred_area" required placeholder="City, district or state"></label><label class="check"><input required type="checkbox"> Allow location access for location-aware alerts</label><button class="btn btn-primary full">Create Safety Profile</button></form>
<p class="center small">Already registered? <a class="link" href="login.html">Login here</a></p><div class="note">Backend connected: your account, location and alert profile are stored in the Django database. Background tracking still requires a PWA/mobile app.</div></div></main><script src="js/script.js"></script></body></html>
